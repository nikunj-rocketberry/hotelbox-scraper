services:
  postgres:
    image: postgres:16
    container_name: hotelbox-scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotelbox
      POSTGRES_PASSWORD: hotelbox
      POSTGRES_DB: hotelbox
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: hotelbox-scraper-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: hotelbox-scraper-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
